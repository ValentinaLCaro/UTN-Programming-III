<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Food Store - Login</title>
</head>

<body>
    <div class="container">
        <form class="login-form">
            <h1>Food Store</h1>
            <h2>Iniciar Sesión</h2>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="johndoe@gmail.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>

            <button type="submit">Ingresar</button>

            <p class="registro">
                ¿No tenés cuenta? <a href="#">Registrate acá</a>
            </p>
        </form>
    </div>
</body>
</html>
